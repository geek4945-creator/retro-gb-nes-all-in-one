# fly launch --copy-config --no-deploy && fly deploy   (from the server/ folder)
app = "retro-pocket-netplay"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "9000"

[http_service]
  internal_port = 9000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
