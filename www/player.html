<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Retro Pocket – Playing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/player.css">
</head>
<body>
  <div id="game"></div>
  <button id="back" aria-label="Back to library" hidden tabindex="-1">‹ Library</button>
  <button id="menu-btn" aria-label="Game menu" data-pos="right"><span>☰</span></button>
  <div id="ptoast" hidden></div>
  <div id="pmenu" hidden role="dialog" aria-label="Game menu">
    <div class="crash-box">
      <h2>Paused</h2>
      <button id="pm-resume">▶ Resume</button>
      <button id="pm-save">Save state</button>
      <button id="pm-load">Load state</button>
      <button id="pm-restart">Restart game</button>
      <div id="pm-grid" class="pm-grid">
        <button id="pm-sound">🔊 Sound: On</button>
        <button id="pm-ff">⏩ Fast-forward: Off</button>
        <button id="pm-shot">📸 Screenshot</button>
        <button id="pm-full">⛶ Fullscreen</button>
        <button id="pm-controls">🎮 Controls…</button>
        <button id="pm-cheats">🧪 Cheats…</button>
        <button id="pm-disc">💿 Disc / disk…</button>
        <button id="pm-settings">⚙ Emulator settings…</button>
        <button id="pm-btnpos">📍 Menu button: Top-right</button>
      </div>
      <button id="pm-exit" class="ghost">Exit to library</button>
      <p class="hint">Controller: <b>Select + Start</b> (hold) menu · <b>Select + R1</b> quick save · <b>Select + L1</b> quick load</p>
      <p id="pm-hint" class="hint"></p>
    </div>
  </div>
  <div id="pmpanel" hidden role="dialog" aria-label="Emulator panel">
    <div class="pmpanel-bar"><button id="pmpanel-back">‹ Back</button><b id="pmpanel-title"></b></div>
    <div id="pmpanel-body"></div>
  </div>
  <div id="status">Loading…</div>
  <div id="banner" hidden></div>
  <div id="crash" hidden role="alertdialog" aria-labelledby="crash-title">
    <div class="crash-box">
      <h2 id="crash-title">Game crashed</h2>
      <p id="crash-msg"></p>
      <p id="crash-detail" class="detail"></p>
      <button id="crash-resume" hidden>Resume from last auto-save</button>
      <button id="crash-restart">Restart game</button>
      <button id="crash-alt" hidden>Try another core</button>
      <button id="crash-lib" class="ghost">Back to library</button>
    </div>
  </div>
  <script type="module" src="js/player.js"></script>
</body>
</html>
