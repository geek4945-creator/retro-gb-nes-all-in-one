name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK to a GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Accept Android SDK licenses (SDK is preinstalled on ubuntu-latest)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install deps and check web app
        run: |
          npm ci
          node scripts/check.mjs
      - name: Sync web app into the Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RetroPocket-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RetroPocket-debug-apk
          path: RetroPocket-debug.apk
          if-no-files-found: error
      - name: Publish rolling "latest" release (main) / versioned release (tags)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"; EXTRA=""
          else
            TAG="latest"; EXTRA="--prerelease"
            gh release delete "$TAG" --cleanup-tag --yes || true
          fi
          gh release create "$TAG" RetroPocket-debug.apk $EXTRA \
            --title "Retro Pocket $TAG (debug APK)" \
            --notes "Debug-signed Android APK. Enable *Install unknown apps* for your browser/file manager, then open the APK. Bring your own ROMs." \
            --target "$GITHUB_SHA"
