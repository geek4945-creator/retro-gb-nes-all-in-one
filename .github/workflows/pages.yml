name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['www/**', 'scripts/stamp-build.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history: the build number is the commit count
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Static checks
        run: node scripts/check.mjs
      - name: Stamp build number (build-info.json + service-worker version)
        run: node scripts/stamp-build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deployment
        uses: actions/deploy-pages@v4
